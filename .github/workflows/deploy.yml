name: EduShare AWS Auto-Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Continuous Deployment to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via Native OpenSSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "=========================================="
          echo "🔍 Environment & Secret Diagnostics:"
          echo "=========================================="
          echo "SSH_HOST: $SSH_HOST (len: ${#SSH_HOST})"
          echo "SSH_USER: $SSH_USER (len: ${#SSH_USER})"
          echo "SSH_KEY length: ${#SSH_KEY}"
          echo "SSH_KEY line count: $(printf '%s\n' "$SSH_KEY" | wc -l)"
          echo "SSH_KEY start: $(printf '%s\n' "$SSH_KEY" | head -n 1)"
          echo "SSH_KEY end:   $(printf '%s\n' "$SSH_KEY" | tail -n 1)"
          echo "=========================================="

          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: SSH_KEY secret is completely empty!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key file
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Check with ssh-keygen
          echo "🔍 Verifying key with ssh-keygen..."
          ssh-keygen -y -f ~/.ssh/id_rsa || {
            echo "❌ ERROR: ssh-keygen could not parse the private key."
            exit 1
          }

          echo "✅ SSH Key verified successfully."
          echo "📡 Connecting to EC2 ($SSH_USER@$SSH_HOST)..."

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "=========================================="
            echo "🔄 Pulling Latest Code on EC2..."
            echo "=========================================="
            cd /opt/edushare
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            echo "=========================================="
            echo "✅ Deployment Finished! Current Containers:"
            echo "=========================================="
            docker compose -f docker-compose.prod.yml ps
          EOF
