name: EduShare AWS Auto-Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Continuous Deployment to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via Native OpenSSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "=========================================="
          echo "🚀 Configuring SSH Client on Runner..."
          echo "=========================================="
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key ensuring proper trailing newline
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Verify key structure
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "❌ ERROR: The EC2_SSH_KEY in GitHub Secrets could not be parsed by OpenSSH."
            echo "Please ensure the entire private key (including BEGIN and END lines) is pasted correctly."
            exit 1
          fi

          echo "✅ SSH Key verified successfully."
          echo "📡 Connecting to EC2 ($SSH_USER@$SSH_HOST)..."

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "=========================================="
            echo "🔄 Pulling Latest Code on EC2..."
            echo "=========================================="
            cd /opt/edushare
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            echo "=========================================="
            echo "✅ Deployment Finished! Current Containers:"
            echo "=========================================="
            docker compose -f docker-compose.prod.yml ps
          EOF
