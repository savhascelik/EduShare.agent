name: EduShare AWS Auto-Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Continuous Deployment to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via Native OpenSSH
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "=========================================="
          echo "🚀 Configuring SSH Client on Runner..."
          echo "=========================================="
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Sanitize host: strip http://, trailing slashes, and whitespace
          SSH_HOST=$(printf '%s' "$RAW_HOST" | sed -e 's|^https*://||' -e 's|/.*$||' | tr -d '[:space:]')
          SSH_USER=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')
          
          # Default to ubuntu if empty
          if [ -z "$SSH_USER" ]; then
            SSH_USER="ubuntu"
          fi

          echo "Target Host: $SSH_HOST"
          echo "Target User: $SSH_USER"

          # Strip Windows CRLF (\r) and ensure clean Linux LF (\n)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # If the key is base64-encoded, decode it
          if ! grep -q "BEGIN" ~/.ssh/id_rsa; then
            echo "Key appears to be Base64 encoded, attempting decode..."
            printf '%s' "$SSH_KEY" | base64 -d | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi

          echo "🔍 Validating SSH key structure..."
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "❌ ERROR: SSH key could not be parsed by ssh-keygen."
            exit 1
          fi

          echo "✅ SSH Key successfully validated with OpenSSH!"
          echo "📡 Connecting to EC2 ($SSH_USER@$SSH_HOST)..."

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "=========================================="
            echo "🔄 Pulling Latest Code on EC2..."
            echo "=========================================="
            cd /opt/edushare
            git config --global --add safe.directory /opt/edushare
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            echo "=========================================="
            echo "✅ Deployment Finished! Current Containers:"
            echo "=========================================="
            docker compose -f docker-compose.prod.yml ps
          EOF
