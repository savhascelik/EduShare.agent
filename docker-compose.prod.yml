services:
  postgres:
    image: postgres:16-alpine
    container_name: edushare-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edushare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edushare_password}
      POSTGRES_DB: ${POSTGRES_DB:-edushare_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edushare_user -d edushare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edushare-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://edushare_user:edushare_password@postgres:5432/edushare_db
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET:-edushare_super_secret_jwt_key_2026}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edushare-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
